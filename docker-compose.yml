services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret-change-me"
      # Set in .env (not committed). Empty = ticketing disabled.
      DATABASE_URL: "${DATABASE_URL:-}"
      # Sized for the bot-lab burst: the buy path is one Redis round trip, so
      # the pool is the real concurrency limit on the hot path.
      REDIS_POOL_SIZE: "512"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
    # The burst opens thousands of short-lived sockets at once.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    # No persistence: a drop is ephemeral and the bot lab resets between runs.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxclients", "20000"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
