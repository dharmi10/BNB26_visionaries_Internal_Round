worker_processes auto;
events { worker_connections 8192; }
http {
  resolver 127.0.0.11 valid=5s ipv6=off;
  gzip on; gzip_min_length 1024; gzip_types application/json text/plain;
  access_log off;
  upstream api {
    server api1:8080 max_fails=1 fail_timeout=2s;
    server api2:8080 max_fails=1 fail_timeout=2s;
    server api3:8080 max_fails=1 fail_timeout=2s;
    keepalive 256;
  }
  map $http_upgrade $conn_up { default upgrade; '' close; }
  server {
    listen 80;
    # real requests are a few hundred bytes: refuse big bodies at the door (a bot sending huge bodies must not eat memory).
    client_max_body_size 64k;
    # a connection that goes quiet (Slowloris) is dropped after 10 s instead of holding a slot
    client_header_timeout 10s; client_body_timeout 10s; send_timeout 30s;
    # Live monitor stream (SSE): no buffering
    location ~ ^/api/admin/drops/[^/]+/live$ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_buffering off; proxy_read_timeout 1h;
      proxy_set_header X-Real-IP $remote_addr;
    }
    # bulk test uploads (labels, experiment results) are the only big bodies; test endpoints do not exist outside TEST_MODE
    location /api/test/ {
      client_max_body_size 32m;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
    }
    location /api/ {
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://api;
      proxy_http_version 1.1; proxy_set_header Connection "";
      proxy_set_header X-Real-IP $remote_addr;
      # A replica dying mid-request is retried on another one. Safe for POSTs because every mutating
      # endpoint is idempotent (deterministic receipts, spent-token set, Idempotency-Key, one-token-per-identity).
      proxy_next_upstream error timeout http_502 http_503 non_idempotent;
      proxy_next_upstream_tries 3;
      proxy_connect_timeout 1s;
      proxy_read_timeout 120s;
    }
    location /attack/ {
      set $atk http://attack:9200;
      rewrite ^/attack/(.*)$ /$1 break;
      proxy_pass $atk;
      proxy_read_timeout 60s;
    }
    location / {
      set $web http://frontend:3000;
      proxy_pass $web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $conn_up;
      proxy_set_header Host $host;
    }
  }
}
